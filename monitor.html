<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>MONITOR · FULL CORE · RESPO-PIPE</title>

<style>
body{background:#000;color:#0f0;font-family:monospace;padding:40px;}
h1{color:#6cf;text-align:center;margin-bottom:30px;}
button{background:#111;color:#0f0;border:1px solid #333;padding:10px 20px;margin:10px 0;}
pre{background:#111;border-left:3px solid #6cf;padding:20px;white-space:pre-wrap;}
.block{margin-bottom:30px;}
</style>

<script type="module">

// Kernmodule
import { A81CACHE } from "./81cache.js";
import { NC_CORE } from "./NC_CORE.js";
import { C81 } from "./81.room";

// Analyse
import { GEO } from "./81geo.js";

// Operator
import { Operator9 } from "./9.js";

// 243 Runtime
import { run243 } from "./243.js";

// RESPO
import { buildRespo100 } from "./respo100.js";
import { buildRespo360 } from "./respo360.js";
import { buildDashboard } from "./respoDashboard.js";

// RESPO-Code-Pipeline
import { P4 } from "./pipelineP4.js";
import { P0 } from "./pipelineP0.js";
import { P1 } from "./pipelineP1.js";
import { P2 } from "./pipelineP2.js";
import { Pe } from "./pipelinePe.js";

function coreScan(){

    const r100 = buildRespo100();
    const r360 = buildRespo360();
    const dash = buildDashboard(r100, r360);

    const c81 = C81.init();
    const geo = GEO.analyze(c81);
    const op9 = Operator9.init();
    const pq243 = run243();

    const nc = NC_CORE.init(
        c81,
        r360,
        pq243,
        A81CACHE.read(),
        op9,
        geo
    );

    const core = {
        respo100: r100,
        respo360: r360,
        dashboard: dash,
        c81,
        geo,
        operator9: op9,
        pq243,
        nc,
        cache: A81CACHE.read(),
        timestamp: Date.now()
    };

    A81CACHE.write(core);
    return core;
}

window.runMonitor = () => {
    const out = coreScan();
    document.getElementById("out").innerText =
        JSON.stringify(out, null, 2);
};

// Pipeline-Phasen
window.runP4 = () => document.getElementById("out").innerText =
    JSON.stringify(P4.run(coreScan()), null, 2);

window.runP0 = () => document.getElementById("out").innerText =
    JSON.stringify(P0.run(coreScan()), null, 2);

window.runP1 = () => document.getElementById("out").innerText =
    JSON.stringify(P1.run(coreScan()), null, 2);

window.runP2 = () => document.getElementById("out").innerText =
    JSON.stringify(P2.run(coreScan()), null, 2);

window.runPe = () => document.getElementById("out").innerText =
    JSON.stringify(Pe.run(coreScan()), null, 2);

</script>

</head>

<body>

<h1>MONITOR · FULL CORE · RESPO-PIPE</h1>

<div class="block">
    <button onclick="runMonitor()">MONITOR starten</button>

    <button onclick="runP4()">P4 · start</button>
    <button onclick="runP0()">P0 · wake</button>
    <button onclick="runP1()">P1 · melt</button>
    <button onclick="runP2()">P2 · merge</button>
    <button onclick="runPe()">Pe · finalize</button>

    <pre id="out">Bereit…</pre>
</div>

</body>
</html>
